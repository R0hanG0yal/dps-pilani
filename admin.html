<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>404 Not Found &bull; Durga Public School, Pilani</title>
  <link rel="icon" type="image/png" href="assets/logo-badge.png">
  <link rel="stylesheet" href="css/premium.css">
  <style>
    body {
      background: #FAF8F5;
      color: #2E0815;
      font-family: var(--font-ui, sans-serif);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .err-card {
      max-width: 460px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid rgba(217, 184, 138, 0.45);
      border-radius: 20px;
      padding: 44px 32px;
      box-shadow: 0 16px 40px rgba(46, 8, 21, 0.08);
    }
    .err-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.6rem;
      font-weight: 800;
      color: #B45309;
      line-height: 1;
      margin-bottom: 12px;
    }
    .err-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: #2E0815;
      margin-bottom: 10px;
    }
    .err-desc {
      font-size: 0.88rem;
      color: #64748B;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 999px;
      background: #2E0815;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn-home:hover {
      background: #7D1D3F;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="err-card">
    <div class="err-code">404</div>
    <h1 class="err-title">Resource Not Found</h1>
    <p class="err-desc">The requested institutional resource does not exist on this server or has been permanently decommissioned.</p>
    <a href="index.html" class="btn-home">Return to Homepage &rarr;</a>
  </div>
</body>
</html>
